name: Wiki Auto-Sync

on:
  workflow_dispatch:
    
  push:
    branches:
      - main
    paths:
      - 'docs/**'

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v5
        with:
          path: main-repo

      - name: Checkout Wiki Repository
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo

      - name: Flatten Folders, Generate Sidebar, and Push to Wiki
        run: |
          rm -rf wiki-repo/*
          
          cd main-repo/docs
          
          echo "### Navigation" > ../../wiki-repo/_Sidebar.md
          
          last_dir=""
          
          find . -type f | sort | while read -r file; do
            clean_path="${file#./}"
            
            if [ "$clean_path" = "docslist.txt" ]; then
              echo "Skipping $clean_path"
              continue
            fi
            
            current_dir=$(dirname "$clean_path")
            
            if [ "$current_dir" != "." ] && [ "$current_dir" != "$last_dir" ]; then
              dir_header="$(tr '[:lower:]' '[:upper:]' <<< "${current_dir:0:1}")${current_dir:1}"
              
              echo "* **$dir_header**" >> ../../wiki-repo/_Sidebar.md
              
              last_dir="$current_dir"
            fi
            
            wiki_filename=$(echo "$clean_path" | tr '/' '-')
            cp "$clean_path" "../../wiki-repo/$wiki_filename"
            
            wiki_pagename="${wiki_filename%.md}"
            
            if [ "$current_dir" != "." ]; then
              indent="  "
            else
              indent=""
            fi
            
            display_name=$(basename "$clean_path" .md)
            display_name="$(tr '[:lower:]' '[:upper:]' <<< "${display_name:0:1}")${display_name:1}"
            
            echo "${indent}* [[$display_name|$wiki_pagename]]" >> ../../wiki-repo/_Sidebar.md
          done
          
          cd ../../wiki-repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated wiki update and sidebar generation from GitHub Action"
            git push
          else
            echo "No changes to commit"
          fi
