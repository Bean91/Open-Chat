name: Wiki Auto-Sync

on:
  workflow_dispatch:
    
  push:
    branches:
      - main
    paths:
      - 'docs/**'

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v5
        with:
          path: main-repo

      - name: Checkout Wiki Repository
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo

      - name: Copy Files and Push to Wiki
        run: |
          rm -rf wiki-repo/*
          cp -r main-repo/docs/* wiki-repo/
          
          cd wiki-repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated wiki update from GitHub Action"
            git push
          fi
